[package]
name = "infertap"
version = "0.1.0"
edition = "2021"
# The tree's floor, not the crate's: parquet/arrow 59 and hashbrown 0.17 (edition 2024)
# need 1.85. CI's msrv job checks the locked tree on exactly this version.
rust-version = "1.85"
publish = false
license = "Apache-2.0"
authors = ["InferTap <cort@infertap.ai>"]
description = "A passive, out-of-band tap on inference-engine telemetry."
repository = "https://github.com/infertap/tap"
homepage = "https://infertap.ai"
readme = "README.md"
keywords = ["llm", "inference", "kv-cache", "observability", "telemetry"]
categories = ["development-tools::profiling"]

[lints.rust]
unsafe_code = "forbid"
# Every public type can be printed by a debugger or a log line; `Key` implements it by
# hand to redact.
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
# A panic in library or binary code is a decision with a reason on the line, never a
# reflex: each remaining `expect` names why it cannot fire, and tests opt out per module.
unwrap_used = "warn"
expect_used = "warn"

[features]
# The live ZMQ SUB transport both engines publish to. Off by default so the base build
# does not need libzmq; on, it binds libzmq (the reference implementation the engines'
# publishers use).
zmq = ["dep:zmq"]
# Test support (`src/testing.rs`): the in-memory transport, a scripted source, scratch
# directories and fixture loaders this crate's own tests and examples share. The
# dev-dependency on the crate itself enables it for every test and example target; a
# release build never carries it.
testing = []

[dependencies]
inference-events = { version = "1.0.0", path = "vendor/inference-events" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
rmp-serde = "1"
signal-hook = "0.3"
zmq = { version = "0.10", optional = true }
# The shipped-form encoder (spec 2.1): default features off keeps arrow out of the tree, and
# the snap codec is pure Rust, so the base build still needs no C toolchain.
parquet = { version = "59.2", default-features = false, features = ["snap"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
log = { version = "0.4.34", features = ["std"] }
fs2 = "0.4.3"

[dev-dependencies]
infertap = { path = ".", features = ["testing"] }
# The round-trip verifier only: tests decode what the converter wrote (and the corpus's
# pyarrow-written twin) through the arrow reader, a second implementation. Never ships.
parquet = { version = "59.2", default-features = false, features = ["snap", "arrow"] }
